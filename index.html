<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수수료 지원 챗봇</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        body { background-color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { position: relative; width: 100%; max-width: 450px; height: 90vh; background-color: #f8f9fa; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        
        .splash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #242a38; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; transition: opacity 0.5s ease, visibility 0.5s ease; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .splash-screen h2 { font-size: 18px; margin-bottom: 8px; font-weight: bold; letter-spacing: 0.5px; }
        .splash-screen p { font-size: 13px; color: #adb5bd; }

        .chat-header { background-color: #242a38; color: white; padding: 20px; display: flex; align-items: center; gap: 12px; }
        .shield-icon { background-color: #3b82f6; width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .header-text h1 { font-size: 16px; margin-bottom: 4px; font-weight: bold; }
        .header-text p { font-size: 12px; color: #adb5bd; margin-bottom: 4px; }
        
        /* 임시 링크 스타일 */
        .temp-link { font-size: 11px; color: #ced4da; }
        .temp-link a { color: #66d9e8; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .temp-link a:hover { color: #99e9f2; text-decoration: underline; }
        
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .msg-row { display: flex; gap: 10px; width: 100%; }
        .msg-row.bot { justify-content: flex-start; }
        .msg-row.user { justify-content: flex-end; }
        .ai-avatar { width: 36px; height: 36px; background-color: #1e293b; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; flex-shrink: 0; }
        .msg-content { display: flex; flex-direction: column; gap: 8px; max-width: 75%; }
        .msg-bubble { padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .msg-row.bot .msg-bubble { background-color: #ffffff; color: #333; border: 1px solid #e9ecef; border-top-left-radius: 4px; }
        .msg-row.user .msg-bubble { background-color: #3b82f6; color: #ffffff; border-top-right-radius: 4px; }
        
        .inline-btn-container { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .inline-btn-container.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .inline-btn { background-color: #ffffff; border: 1px solid #cce0ff; color: #3b82f6; padding: 12px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; width: 100%; word-break: keep-all; }
        .inline-btn:hover { background-color: #f0f6ff; border-color: #3b82f6; }
        
        /* 이전 단계, 처음으로 버튼 등 기능 버튼 색상/스타일 차별화 */
        .inline-btn.action-btn { background-color: #f1f3f5; color: #495057; border-color: #dee2e6; }
        .inline-btn.action-btn:hover { background-color: #e9ecef; }
        
        .inline-btn-container.grid3 .inline-btn { padding: 10px 4px; font-size: 13px; }
        .inline-btn.full-span { grid-column: 1 / -1; }

        .input-area { display: flex; background-color: #ffffff; padding: 10px 15px 15px 15px; align-items: center; gap: 10px; border-top: 1px solid #e9ecef; }
        .input-area input { flex: 1; border: 1px solid #dee2e6; padding: 12px 15px; border-radius: 25px; font-size: 14px; outline: none; transition: 0.2s; }
        .input-area input:focus { border-color: #3b82f6; }
        .send-btn { background-color: #3b82f6; border: none; color: white; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .send-btn:hover { background-color: #2563eb; }
        .send-btn svg { width: 20px; height: 20px; fill: white; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="splash-screen" id="splashScreen">
        <div class="spinner"></div>
        <h2>데이터 동기화 중...</h2>
        <p>최신 데이터 불러오는중...</p>
    </div>

    <div class="chat-header">
        <div class="shield-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1Z"/></svg>
        </div>
        <div class="header-text">
            <h1>수수료 지원 챗봇</h1>
            <p>AI는 정보 제공시 실수를 할 수 있습니다🥲</p>
            <div class="temp-link">
                임시 : <a href="https://docs.google.com/spreadsheets/d/15oN1_97U6XIcElBJGTWubpfiWYPp-bb1MLxgskWxfTc/edit?usp=sharing" target="_blank">구글 시트 바로가기</a>
            </div>
        </div>
    </div>
    
    <div class="chat-box" id="chatBox"></div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="메시지를 입력하거나 버튼을 누르세요" onkeypress="handleEnter(event)">
        <button class="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z" /></svg>
        </button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwAUZd9dyeaOVu3rRcmLUvyHAb6sckNeiz7eKbvzn1JSxoTp871juOUGdLe_YYbvh52/exec";

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const splashScreen = document.getElementById("splashScreen");

    let globalData = { content: [], products: [] }; 
    let calcState = 0; 
    let calcData = { company: '', name: '', term: '', type: '', conv1: 0, payout: 0, premium: 0, grade: 0 };

    const mainOptions = [
        { text: "🏆 이달의 시상", target: "이달의시상" },
        { text: "📊 상품별 수수료율 확인", action: "startCalc" }, 
        { text: "📜 환수/지급 규정", target: "환수지급규정" }
    ];

    function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }

    function addBotMessage(text, options = null, layout = 'column') {
        const row = document.createElement("div");
        row.className = "msg-row bot";
        let htmlContent = `<div class="ai-avatar">AI</div><div class="msg-content"><div class="msg-bubble">${text}</div>`;
        
        if (options && options.length > 0) {
            let containerClass = layout === 'grid3' ? 'inline-btn-container grid3' : 'inline-btn-container';
            htmlContent += `<div class="${containerClass}">`;
            htmlContent += options.map((opt, i) => {
                let btnClass = "inline-btn";
                if (opt.target === "main" || (opt.action && opt.action.startsWith("goBack"))) {
                    btnClass += " action-btn";
                    if (layout === 'grid3') btnClass += " full-span";
                }
                return `<button class="${btnClass}" id="btn-${Date.now()}-${i}">${opt.text}</button>`;
            }).join('');
            htmlContent += `</div>`;
        }
        
        htmlContent += `</div>`;
        row.innerHTML = htmlContent;
        chatBox.appendChild(row);

        if (options && options.length > 0) {
            options.forEach((opt, i) => {
                row.querySelectorAll('.inline-btn')[i].onclick = () => handleMenuClick(opt);
            });
        }
        scrollToBottom();
    }

    function addUserMessage(text) {
        const row = document.createElement("div");
        row.className = "msg-row user";
        row.innerHTML = `<div class="msg-content"><div class="msg-bubble">${text}</div></div>`;
        chatBox.appendChild(row);
        scrollToBottom();
    }

    async function loadDataFromGoogle() {
        try {
            const response = await fetch(API_URL);
            globalData = await response.json();
            splashScreen.style.opacity = "0";
            setTimeout(() => { 
                splashScreen.style.visibility = "hidden"; 
                addBotMessage("안녕하세요! 원하시는 메뉴를 선택해주세요.", mainOptions);
            }, 500);
        } catch (error) {
            splashScreen.style.opacity = "0";
            setTimeout(() => { 
                splashScreen.style.visibility = "hidden"; 
                addBotMessage("❌ 구글 시트 데이터 로딩 실패. URL을 확인해주세요.");
            }, 500);
        }
    }

    function renderCalcState(state) {
        if (state === 10) {
            startCalculator();
        } else if (state === 11) {
            calcState = 11;
            addBotMessage(`🔄 이전 단계로 돌아왔습니다.\n\n[${calcData.company}]\n찾으시는 **상품명의 일부(키워드)**를 다시 입력해주세요.\n(예: 나이스, 우리WON)`, [
                { text: "🔙 이전 (보험사 다시 선택)", action: "goBack_10" },
                { text: "처음으로 돌아가기", target: "main" }
            ]);
        } else if (state === 13) {
            calcState = 13;
            const matched = globalData.products.filter(p => p.company === calcData.company && p.name === calcData.name);
            const uniqueTerms = [...new Set(matched.map(p => p.term))];
            const buttons = uniqueTerms.map(t => ({ text: t || "해당없음" }));
            buttons.push({ text: "🔙 이전 (키워드 다시 검색)", action: "goBack_11" });
            buttons.push({ text: "처음으로 돌아가기", target: "main" });
            addBotMessage(`🔄 이전 단계로 돌아왔습니다.\n\n✅ [${calcData.name}]\n해당 상품의 **납기**를 다시 선택해주세요.`, buttons);
        } else if (state === 14) {
            calcState = 14;
            const matched = globalData.products.filter(p => p.company === calcData.company && p.name === calcData.name && p.term === calcData.term);
            const uniqueTypes = [...new Set(matched.map(p => p.type))];
            const buttons = uniqueTypes.map(t => ({ text: t || "해당없음" }));
            buttons.push({ text: "🔙 이전 (납기 다시 선택)", action: "goBack_13" });
            buttons.push({ text: "처음으로 돌아가기", target: "main" });
            addBotMessage(`🔄 이전 단계로 돌아왔습니다.\n\n해당 상품의 **구분(형태)**을 다시 선택해주세요.`, buttons);
        } else if (state === 15) {
            calcState = 15;
            addBotMessage(`🔄 이전 단계로 돌아왔습니다.\n\n**월납 보험료(원)**를 다시 입력해주세요.\n(예: 100000 또는 10만원)`, [
                { text: "🔙 이전 (상품구분 다시 선택)", action: "goBack_14" },
                { text: "처음으로 돌아가기", target: "main" }
            ]);
        }
    }

    function handleMenuClick(option) {
        addUserMessage(option.text);
        
        setTimeout(() => {
            if (option.target === "main") {
                calcState = 0; 
                addBotMessage("원하시는 메뉴를 선택해주세요.", mainOptions);
            } 
            else if (option.action && option.action.startsWith("goBack_")) {
                let targetState = parseInt(option.action.split("_")[1]);
                renderCalcState(targetState);
            }
            else if (calcState > 0) {
                processCalculator(option.text);
            }
            else if (option.target) {
                const filtered = globalData.content.filter(item => item.category === option.target);
                const buttons = filtered.map(item => ({ text: item.button, reply: item.reply }));
                buttons.push({ text: "처음으로 돌아가기", target: "main" });
                addBotMessage(`${option.text} 세부 항목입니다.`, buttons);
            } 
            else if (option.reply) {
                addBotMessage(option.reply);
                setTimeout(() => addBotMessage("더 궁금한 점이 있으신가요?", mainOptions), 1500);
            } 
            else if (option.action === "startCalc") {
                startCalculator();
            }
        }, 400);
    }

    function startCalculator() {
        calcState = 10;
        const companies = [...new Set(globalData.products.map(p => p.company))].filter(c => c);
        const buttons = companies.map(c => ({ text: c }));
        buttons.push({ text: "처음으로 돌아가기", target: "main" });
        
        addBotMessage("📊 상품별 수수료율 확인을 시작합니다.\n\n먼저 조회하실 **보험사**를 선택하거나 입력해주세요.", buttons, 'grid3');
    }

    function processCalculator(text) {
        if (calcState === 10) { 
            const companies = [...new Set(globalData.products.map(p => p.company))];
            if (!companies.includes(text)) {
                addBotMessage("❌ 등록되지 않은 보험사입니다. 하단 버튼에서 다시 선택해주세요.");
                return;
            }
            calcData.company = text;
            calcState = 11;
            addBotMessage(`✅ [${text}] 선택 완료.\n\n찾으시는 **상품명의 일부(키워드)**를 채팅창에 입력해주세요.\n(예: 나이스, 우리WON)`, [
                { text: "🔙 이전 (보험사 다시 선택)", action: "goBack_10" },
                { text: "처음으로 돌아가기", target: "main" }
            ]);
        }
        else if (calcState === 11) { 
            const keyword = text.replace(/\s+/g, "");
            const matched = globalData.products.filter(p => p.company === calcData.company && p.name.replace(/\s+/g, "").includes(keyword));
            
            if (matched.length === 0) {
                addBotMessage(`❌ '${text}'(으)로 검색된 상품이 없습니다. 다른 키워드를 입력해주세요.`);
                return;
            }
            
            const uniqueNames = [...new Set(matched.map(p => p.name))];
            const buttons = uniqueNames.slice(0, 6).map(n => ({ text: n }));
            buttons.push({ text: "🔙 이전 (키워드 다시 검색)", action: "goBack_11" });
            buttons.push({ text: "처음으로 돌아가기", target: "main" });
            
            calcState = 12;
            addBotMessage(`🔍 '${text}' 검색 결과입니다. 정확한 상품을 선택해주세요.`, buttons);
        }
        else if (calcState === 12) { 
            calcData.name = text;
            const matched = globalData.products.filter(p => p.company === calcData.company && p.name === calcData.name);
            if (matched.length === 0) return; 

            const uniqueTerms = [...new Set(matched.map(p => p.term))];
            const buttons = uniqueTerms.map(t => ({ text: t || "해당없음" }));
            buttons.push({ text: "🔙 이전 (키워드 다시 검색)", action: "goBack_11" });
            buttons.push({ text: "처음으로 돌아가기", target: "main" });
            
            calcState = 13;
            addBotMessage(`✅ [${calcData.name}] 선택 완료.\n\n해당 상품의 **납기**를 선택해주세요.`, buttons);
        }
        else if (calcState === 13) { 
            calcData.term = text === "해당없음" ? "" : text;
            const matched = globalData.products.filter(p => p.company === calcData.company && p.name === calcData.name && p.term === calcData.term);
            
            const uniqueTypes = [...new Set(matched.map(p => p.type))];
            const buttons = uniqueTypes.map(t => ({ text: t || "해당없음" }));
            buttons.push({ text: "🔙 이전 (납기 다시 선택)", action: "goBack_13" });
            buttons.push({ text: "처음으로 돌아가기", target: "main" });
            
            calcState = 14;
            addBotMessage(`✅ 납기 선택 완료.\n\n해당 상품의 **구분(형태)**을 선택해주세요.`, buttons);
        }
        else if (calcState === 14) { 
            calcData.type = text === "해당없음" ? "" : text;
            const finalRow = globalData.products.find(p => p.company === calcData.company && p.name === calcData.name && p.term === calcData.term && p.type === calcData.type);
            
            if (!finalRow) {
                addBotMessage("❌ 해당 조건의 데이터를 찾지 못했습니다. 이전 단계로 돌아가 다시 선택해주세요.", [
                    { text: "🔙 이전 (납기 다시 선택)", action: "goBack_13" }
                ]);
                return;
            }
            
            calcData.conv1 = finalRow.conv1;
            calcData.payout = finalRow.payout; 
            
            calcState = 15;
            addBotMessage(`🎯 상품 스펙이 확인되었습니다!\n- 확인된 환산1차율: **${calcData.conv1}%**\n\n이어서 **월납 보험료(원)**를 입력해주세요.\n(예: 100000 또는 10만원)`, [
                { text: "🔙 이전 (상품구분 다시 선택)", action: "goBack_14" },
                { text: "처음으로 돌아가기", target: "main" }
            ]);
        }
        else if (calcState === 15) { 
            let rawText = text.replace(/,/g, ""); 
            let num = 0;
            
            if (rawText.includes("만")) {
                let parts = rawText.split("만");
                let manPart = Number(parts[0].replace(/[^0-9]/g, "")) || 0;
                let restPart = Number(parts[1].replace(/[^0-9]/g, "")) || 0;
                num = (manPart * 10000) + restPart;
            } else {
                num = Number(rawText.replace(/[^0-9]/g, ""));
            }

            if (isNaN(num) || num === 0) { 
                addBotMessage("❌ 금액을 정확히 입력해주세요. (예: 100000 또는 10만원)"); 
                return; 
            }
            
            calcData.premium = num;
            calcState = 16;
            
            addBotMessage(`✅ 보험료 ${num.toLocaleString()}원 확인.\n\n마지막으로 본인의 **수수료 등급(%)**을 숫자만 입력해주세요.\n(예: 90.5)`, [
                { text: "🔙 이전 (보험료 다시 입력)", action: "goBack_15" },
                { text: "처음으로 돌아가기", target: "main" }
            ]);
        }
        else if (calcState === 16) { 
            // 💡 여기서 소수점(.) 입력을 허용하도록 정규식 수정 [^0-9.]
            const grade = Number(text.replace(/[^0-9.]/g, ""));
            if (isNaN(grade) || grade === 0) { addBotMessage("❌ 숫자로만 다시 입력해주세요. (예: 98.5)"); return; }
            
            calcData.grade = grade;
            calcState = 0; 
            
            let appliedPayoutRate = calcData.payout * (calcData.grade / 100);
            let estimated = calcData.premium * (calcData.conv1 / 100) * (appliedPayoutRate / 100);
            
            // 💡 적용 지급율 소수점 지저분하게 나오지 않도록 변환
            let displayPayoutRate = Number(appliedPayoutRate.toFixed(3));
            
            let result = `🎉 수수료 계산 결과입니다!\n\n`;
            result += `📦 **상품명:** ${calcData.company} ${calcData.name}\n`;
            result += `⏳ **조건:** ${calcData.term} / ${calcData.type || "기본형"}\n\n`;
            result += `📊 **환산 1차:** ${calcData.conv1}%\n`;
            result += `📈 **적용 지급율: ${displayPayoutRate}%**\n`;
            result += `💰 **예상 수수료: ${Math.floor(estimated).toLocaleString()}원**\n\n`;
            result += `(산식: 보험료 ${calcData.premium.toLocaleString()}원 × 환산1차율 ${calcData.conv1}% × 적용 지급율 ${displayPayoutRate}%)`;
            
            addBotMessage(result, [
                { text: "🔄 이 상품으로 다시 계산 (금액 정정)", action: "goBack_15" },
                { text: "처음으로 돌아가기", target: "main" }
            ]);
        }
    }

    function handleEnter(event) { if (event.key === "Enter") sendMessage(); }

    function sendMessage() {
        const text = userInput.value.trim();
        if (text === "") return;
        
        addUserMessage(text);
        userInput.value = "";

        setTimeout(() => {
            if (calcState > 0) { processCalculator(text); return; }

            if (text.includes("시상") || text.includes("프로모션")) handleMenuClick({text:"이달의시상", target:"이달의시상"});
            else if (text.includes("수수료") || text.includes("상품")) handleMenuClick({text:"상품별수수료율 확인", action:"startCalc"});
            else if (text.includes("환수") || text.includes("규정")) handleMenuClick({text:"환수지급규정", target:"환수지급규정"});
            else {
                addBotMessage("키워드를 찾지 못했습니다. 아래 버튼을 이용해 주세요.", mainOptions);
            }
        }, 400);
    }

    window.onload = () => { loadDataFromGoogle(); };
</script>
</body>
</html>
